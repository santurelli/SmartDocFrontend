<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020d1a" />
      <stop offset="50%" stop-color="#081e36" />
      <stop offset="100%" stop-color="#051221" />
    </linearGradient>
    
    <!-- Glowing Blue/Cyan Gradient -->
    <linearGradient id="glowBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="100%" stop-color="#4facfe" />
    </linearGradient>

    <!-- Glowing Cyan/Green Gradient for Pen/Smart elements -->
    <linearGradient id="glowSmart" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3af6b0" />
      <stop offset="100%" stop-color="#00a896" />
    </linearGradient>

    <!-- Glassmorphic Document Fill -->
    <linearGradient id="glassGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(15, 32, 54, 0.75)" />
      <stop offset="100%" stop-color="rgba(8, 22, 38, 0.9)" />
    </linearGradient>
    
    <!-- Subtle glow filter for the ultimate premium look -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background Squircle -->
  <rect x="24" y="24" width="464" height="464" rx="128" fill="url(#bgGrad)" stroke="#132f54" stroke-width="12" />

  <!-- Glowing background elements for depth -->
  <circle cx="160" cy="160" r="120" fill="#4facfe" opacity="0.15" filter="url(#neonGlow)" />
  <circle cx="360" cy="360" r="100" fill="#3af6b0" opacity="0.1" filter="url(#neonGlow)" />

  <!-- Document Sheet -->
  <rect x="110" y="90" width="240" height="332" rx="28" fill="url(#glassGrad)" stroke="url(#glowBlue)" stroke-width="16" />
  
  <!-- Folded Corner Indicator (Clean minimal design) -->
  <path d="M 290 90 L 350 90 L 350 150 C 350 117 323 90 290 90 Z" fill="url(#glowBlue)" />

  <!-- Document Lines -->
  <rect x="150" y="160" width="100" height="14" rx="7" fill="url(#glowBlue)" opacity="0.7" />
  <rect x="150" y="200" width="150" height="14" rx="7" fill="url(#glowBlue)" opacity="0.7" />
  <rect x="150" y="240" width="120" height="14" rx="7" fill="url(#glowBlue)" opacity="0.7" />

  <!-- Smart Digital Signature (Bezier flow) -->
  <path d="M 150 330 c 15 -15, 30 15, 45 -5 c 15 -20, 25 15, 40 -10 c 15 -25, 25 20, 45 5 c 20 -15, 35 10, 50 -15" 
        fill="none" stroke="url(#glowSmart)" stroke-width="16" stroke-linecap="round" stroke-linejoin="round" filter="url(#neonGlow)" />

  <!-- Digital Smart Stylus Pen -->
  <g transform="rotate(35, 350, 250)">
    <!-- Pen body -->
    <rect x="334" y="80" width="32" height="280" rx="16" fill="url(#glowBlue)" />
    <!-- Pen tip -->
    <path d="M 334 330 L 350 370 L 366 330 Z" fill="url(#glowSmart)" />
    <!-- Glowing pen ring -->
    <rect x="334" y="290" width="32" height="12" fill="#ffffff" opacity="0.8" />
  </g>
</svg>
